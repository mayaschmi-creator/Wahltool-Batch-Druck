name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --windowed --onefile --collect-all playwright --name WahltoolBatchDruck wahltool_batch_druck.py
      - uses: actions/upload-artifact@v4
        with:
          name: WahltoolBatchDruck-windows
          path: dist/WahltoolBatchDruck.exe