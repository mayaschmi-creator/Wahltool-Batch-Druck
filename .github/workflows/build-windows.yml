name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Syntax prüfen
        run: python -m py_compile wahltool_batch_druck.py
      - name: Tests ausführen
        run: python -m unittest discover -s tests -v
      - name: Windows-Programm bauen
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --collect-all playwright --collect-all pypdf --collect-all pdfplumber --collect-all pdfminer --name WahltoolBatchDruck wahltool_batch_druck.py
      - uses: actions/upload-artifact@v6
        with:
          name: WahltoolBatchDruck-windows
          path: dist/WahltoolBatchDruck.exe
          if-no-files-found: error
